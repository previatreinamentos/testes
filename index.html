<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calendário de Postagens</title>

  <style>
    :root {
      --primary: #0284c7;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --whatsapp: #25d366;
      --instagram: #e1306c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 14px 8px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      margin-bottom: 14px;
    }

    .top-bar h1 {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .btn-voltar {
      background: #f1f5f9;
      color: var(--text-main);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid var(--border-color);
    }

    .cal-container {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border-color);
    }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .cal-header h2 {
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: capitalize;
    }

    .btn-nav {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-size: 0.8rem;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day {
      min-height: 140px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      background-size: cover;
      background-position: center;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .day::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.2) 0%, rgba(15, 23, 42, 0.85) 100%);
      z-index: 1;
    }

    .day:hover:not(.empty) {
      transform: scale(1.04);
      z-index: 10;
      border-color: var(--primary);
    }

    .day.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
      min-height: 140px;
    }
    .day.empty::before { display: none; }

    .day-top-row {
      display: flex;
      justify-content: space-between;
      z-index: 2;
    }

    .day-number {
      font-size: 0.8rem;
      font-weight: 800;
      color: #0f172a;
      background: rgba(255, 255, 255, 0.95);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .badge-marco {
      font-size: 0.6rem;
      font-weight: 800;
      color: #ffffff;
      background: var(--primary);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .day-bottom-info {
      z-index: 2;
    }

    .day-event-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    @media (max-width: 860px) {
      .days-grid { gap: 4px; }
      .day, .day.empty { min-height: 95px; padding: 4px; }
      .day-number { font-size: 0.7rem; }
      .day-event-title { font-size: 0.6rem; }
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 10px;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-header h4 {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary);
    }

    .modal-close {
      background: #f1f5f9;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 700;
    }

    .modal-content {
      overflow-y: auto;
      padding-bottom: 16px;
    }

    .modal-img-wrap {
      width: 100%;
      height: 240px;
      background: #e2e8f0;
    }

    .modal-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-body {
      padding: 14px 16px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .modal-desc {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.85rem;
      line-height: 1.45;
      color: #334155;
      margin-bottom: 14px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 8px;
      text-decoration: none;
    }

    .btn-whatsapp { background: var(--whatsapp); }
    .btn-instagram { background: var(--instagram); }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <h1 id="top-title">Calendário de Postagens</h1>
    <a href="https://previatreinamentos.github.io/agendamento/" id="link-voltar" class="btn-voltar">← Voltar à Lista</a>
  </div>

  <div class="cal-container">
    <div class="cal-header">
      <button class="btn-nav" onclick="changeMonth(-1)">◀ Anterior</button>
      <h2 id="cal-month-title">Mês Ano</h2>
      <button class="btn-nav" onclick="changeMonth(1)">Próximo ▶</button>
    </div>

    <div class="weekdays">
      <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
    </div>

    <div class="days-grid" id="calendar-days"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal-card">
    <div class="modal-header">
      <h4 id="modal-date-tag">CAMPANHA DO DIA</h4>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-content">
      <div class="modal-img-wrap">
        <img id="modal-img" src="" alt="Campanha">
      </div>
      <div class="modal-body">
        <h3 class="modal-title" id="modal-title">Título</h3>
        <div class="modal-desc" id="modal-desc">Descrição...</div>
        <button class="btn btn-whatsapp" onclick="shareWhatsApp()">Compartilhar no WhatsApp</button>
        <button class="btn btn-instagram" onclick="shareInstagram()">Copiar Legenda Instagram</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* =========================================================================
     CONFIGURAÇÃO DO GOOGLE DRIVE (COLE A URL DO APPS SCRIPT AQUI)
     ========================================================================= */
  const DRIVE_API_URL = "https://script.google.com/macros/s/AKfycbyttorLvRothU_Ch5lMRTxvWZL3hzYlddsdondxgATkDwvj8BArSGNTH_OolkG16kmy/exec";

  const FALLBACK_DEFAULT = "https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=800&auto=format&fit=crop&q=80";

  const officialEvents = {
    "8-18": { title: "Semana Nacional de Trânsito", desc: "Início oficial da Semana Nacional de Trânsito." },
    "8-22": { title: "Dia Mundial Sem Carro", desc: "Incentivo a mobilidade sustentável." },
    "8-25": { title: "Dia Nacional do Trânsito", desc: "Atenção e respeito pela vida no trânsito." }
  };

  let driveImagesMap = {}; // Armazena as imagens encontradas no Google Drive { "2026-09-25": "https://..." }
  let currentDate = new Date();
  let currentActiveModalData = null;
  const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

  // Busca a lista de imagens da pasta do Google Drive
  async function loadDriveImages() {
    if (!DRIVE_API_URL || DRIVE_API_URL.includes("COLE_AQUI")) {
      renderCalendar();
      return;
    }
    try {
      const res = await fetch(DRIVE_API_URL);
      driveImagesMap = await res.json();
    } catch (e) {
      console.log("Erro ao carregar imagens do Drive, usando imagens padrão:", e);
    }
    renderCalendar();
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("cal-month-title").innerText = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();
    const grid = document.getElementById("calendar-days");
    grid.innerHTML = "";

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement("div");
      empty.className = "day empty";
      grid.appendChild(empty);
    }

    for (let day = 1; day <= totalDays; day++) {
      const dayDiv = document.createElement("div");
      dayDiv.className = "day";

      const officialKey = `${month}-${day}`;
      const official = officialEvents[officialKey];
      const isoDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

      // Verifica se existe uma imagem com essa data no Google Drive
      const imgUrl = driveImagesMap[isoDate] || FALLBACK_DEFAULT;

      dayDiv.style.backgroundImage = `url('${imgUrl}')`;
      dayDiv.onclick = () => openModal(isoDate, day, official, imgUrl);

      const topRow = document.createElement("div");
      topRow.className = "day-top-row";
      const numSpan = document.createElement("span");
      numSpan.className = "day-number";
      numSpan.innerText = day;
      topRow.appendChild(numSpan);

      if (official) {
        const badge = document.createElement("span");
        badge.className = "badge-marco";
        badge.innerText = "MARCO";
        topRow.appendChild(badge);
      }
      dayDiv.appendChild(topRow);

      if (official) {
        const bottomInfo = document.createElement("div");
        bottomInfo.className = "day-bottom-info";
        const titleSpan = document.createElement("div");
        titleSpan.className = "day-event-title";
        titleSpan.innerText = official.title;
        bottomInfo.appendChild(titleSpan);
        dayDiv.appendChild(bottomInfo);
      }

      grid.appendChild(dayDiv);
    }
  }

  function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
  }

  function openModal(isoDate, day, official, activeImgUrl) {
    const [y, m, d] = isoDate.split("-");
    const title = official ? official.title : "Direção Defensiva Diária";
    const desc = official ? official.desc : "A segurança viária depende da atenção e cuidado de todos nós.";

    currentActiveModalData = {
      dateFormatted: `${d}/${m}/${y}`,
      title,
      desc,
      imgUrl: activeImgUrl
    };

    document.getElementById("modal-date-tag").innerText = `${d}/${m}/${y} - CAMPANHA`;
    document.getElementById("modal-title").innerText = title;
    document.getElementById("modal-desc").innerText = desc;
    document.getElementById("modal-img").src = activeImgUrl;

    document.getElementById("modal-overlay").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("modal-overlay").style.display = "none";
  }

  function closeModalOutside(e) {
    if (e.target.id === "modal-overlay") closeModal();
  }

  function getShareText() {
    return `🚦 *Campanha de Trânsito*\n📅 *Data:* ${currentActiveModalData.dateFormatted}\n📌 *${currentActiveModalData.title}*\n\n${currentActiveModalData.desc}\n\nJuntos salvamos vidas!`;
  }

  function shareWhatsApp() {
    const text = encodeURIComponent(getShareText());
    window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
  }

  function shareInstagram() {
    const text = getShareText();
    navigator.clipboard.writeText(text);
    alert("Texto da campanha copiado com sucesso! Agora basta colar no Instagram.");
  }

  // Inicia carregando as imagens do Google Drive
  loadDriveImages();
</script>

</body>
</html>
