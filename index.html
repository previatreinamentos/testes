<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravação de Câmera</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        video { width: 100%; max-width: 400px; background: #000; border-radius: 8px; margin-bottom: 15px; }
        button { padding: 15px 25px; font-size: 16px; margin: 5px; cursor: pointer; border: none; border-radius: 5px; color: white;}
        #btnStart { background-color: #28a745; }
        #btnStop { background-color: #dc3545; display: none; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Gravar e Enviar para Planilha</h2>
    
    <!-- O playsinline é crucial para o iOS não abrir o vídeo em tela cheia -->
    <video id="preview" autoplay muted playsinline></video>
    <br>
    <button id="btnStart">Iniciar Câmera e Gravação</button>
    <button id="btnStop">Parar e Enviar</button>
    <div id="status"></div>

    <script>
        // O SEU LINK FOI INSERIDO AQUI:
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw9Tr05zqfTScZ-ByPo0AJ1MTSB44HufJfnhtsw0m1DxkpVDEHwXXA9TduY23XvobNW/exec';

        let mediaRecorder;
        let recordedChunks = [];
        let videoElement = document.getElementById('preview');
        let btnStart = document.getElementById('btnStart');
        let btnStop = document.getElementById('btnStop');
        let statusDiv = document.getElementById('status');

        btnStart.addEventListener('click', async () => {
            try {
                // Solicita a câmera traseira (environment)
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: true
                });
                
                videoElement.srcObject = stream;
                
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                
                // Limpa gravações anteriores
                recordedChunks = []; 
                
                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    statusDiv.innerText = "Processando e enviando vídeo...";
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    
                    // Converte o arquivo para Base64
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = async () => {
                        const base64data = reader.result.split(',')[1];
                        
                        try {
                            // Envia para o Google Apps Script
                            const response = await fetch(APPS_SCRIPT_URL, {
                                method: 'POST',
                                body: JSON.stringify({ videoBase64: base64data })
                            });
                            
                            const result = await response.json();
                            if(result.status === 'sucesso') {
                                statusDiv.innerText = "Enviado com sucesso! Link salvo na planilha.";
                            } else {
                                statusDiv.innerText = "Erro no servidor: " + result.mensagem;
                            }
                        } catch (fetchError) {
                            statusDiv.innerText = "Erro de conexão ao enviar o vídeo.";
                        }
                    };
                    
                    // Desliga a câmera
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                btnStart.style.display = 'none';
                btnStop.style.display = 'inline-block';
                statusDiv.innerText = "Gravando...";

            } catch (error) {
                statusDiv.innerText = "Erro ao acessar a câmera: " + error.message;
            }
        });

        btnStop.addEventListener('click', () => {
            mediaRecorder.stop();
            btnStop.style.display = 'none';
            btnStart.style.display = 'inline-block';
        });
    </script>
</body>
</html>
