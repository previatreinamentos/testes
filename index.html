  <!-- 3. Web App Manifest Gerado Dinamicamente -->
  <script>
    const myManifest = {
      "name": "Previa Treinamentos",
      "short_name": "Previa",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#ffffff",
      "theme_color": "#042e2a",
      "icons": [
        {
          "src": "https://lh3.googleusercontent.com/pw/AP1GczOHQW3vNgak5n6o5ao_2xrU1jg939u8uya5WNvo9AcA8vATPtKCFkZ7yag8Z53i0T4y14Z4_kgtCSydvki-SqzzprLY09tnJTxG2tdbAgqJjv3fHNffJnHp2aRdyszqR6eMSL3iVpDPIQGRCrOoSp3y=w599-h599-s-no-gm?authuser=0",
          "sizes": "192x192",
          "type": "image/png",
          "purpose": "any maskable"
        },
        {
          "src": "https://lh3.googleusercontent.com/pw/AP1GczOHQW3vNgak5n6o5ao_2xrU1jg939u8uya5WNvo9AcA8vATPtKCFkZ7yag8Z53i0T4y14Z4_kgtCSydvki-SqzzprLY09tnJTxG2tdbAgqJjv3fHNffJnHp2aRdyszqR6eMSL3iVpDPIQGRCrOoSp3y=w599-h599-s-no-gm?authuser=0",
          "sizes": "512x512",
          "type": "image/png",
          "purpose": "any maskable"
        }
      ]
    };

    const stringManifest = JSON.stringify(myManifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const linkManifest = document.createElement('link');
    linkManifest.rel = 'manifest';
    linkManifest.href = manifestURL;
    document.head.appendChild(linkManifest);
  </script>

  <!-- Estilos da Página -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* Faixa Verde Superior de ~2cm sem sombra */
    .top-bar {
      width: 100%;
      height: 75px; 
      background-color: #042e2a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      padding: 0 10px;
    }

    /* Container para o Link Incorporado (iframe) */
    .content-frame {
      width: 100%;
      height: calc(100% - 75px);
      border: none;
      display: block;
    }

    /* ========================================== */
    /* BANNER FLUTUANTE DE INSTALAÇÃO DO PWA      */
    /* ========================================== */
    .install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background-color: #000000;
      color: #ffffff;
      border-radius: 12px;
      padding: 18px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 9999;
      display: none; /* Ativado via JavaScript quando acessado no navegador */
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .install-banner p {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .install-banner-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .btn-install {
      background-color: #00e676;
      color: #000000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      flex: 1;
      max-width: 180px;
    }

    .btn-dismiss {
      background: transparent;
      color: #cccccc;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 8px 12px;
    }
  </style>
</head>
<body>

  <!-- Faixa Verde no topo (#042e2a) -->
  <header class="top-bar">
    AUTOESCOLA DIGITAL PREVIA TREINAMENTOS
  </header>

  <!-- Substitua o atributo 'src' abaixo pelo link que você quer incorporar -->
  <iframe 
    class="content-frame" 
    src="https://script.google.com/macros/s/AKfycby-R3MXQ2lu1J1BXbzyj3k2qyJ52vdAoG-AkaZA8hyYrHqX_A6ivWnaRaEtBFjrq_RMoA/exec" 
    title="Conteúdo Incorporado"
    allow="fullscreen">
  </iframe>

  <!-- POP-UP DE INSTALAÇÃO DO APP -->
  <div id="pwaBanner" class="install-banner">
    <p>Deseja instalar nosso aplicativo para acesso rápido?</p>
    <div class="install-banner-buttons">
      <button id="btnInstall" class="btn-install">Instalar Aplicativo</button>
      <button id="btnDismiss" class="btn-dismiss">Agora não</button>
    </div>
  </div>

  <!-- 4. LÓGICA DE INSTALAÇÃO & SERVICE WORKER -->
  <script>
    let deferredPrompt;
    const banner = document.getElementById('pwaBanner');
    const btnInstall = document.getElementById('btnInstall');
    const btnDismiss = document.getElementById('btnDismiss');

    // Identifica se já está aberto diretamente pelo app (Standalone)
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    // Se NÃO for o aplicativo instalado, exibe o aviso sempre
    if (!isStandalone) {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        banner.style.display = 'flex';
      });

      // Exibe também no iOS ou navegadores que não disparam o 'beforeinstallprompt'
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (!deferredPrompt && !isStandalone) {
            banner.style.display = 'flex';
          }
        }, 1200);
      });
    }

    // Clique em "Instalar Aplicativo"
    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        banner.style.display = 'none';
      } else {
        alert('Para instalar no iPhone (iOS):\n1. Toque no ícone de Compartilhar.\n2. Escolha "Adicionar à Tela de Início".');
      }
    });

    // Clique em "Agora não"
    btnDismiss.addEventListener('click', () => {
      banner.style.display = 'none';
    });

    // Registro do Service Worker obrigatório do PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => new Response('Sem conexão')));
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);

        navigator.serviceWorker.register(swUrl)
          .then(() => console.log('Service Worker registrado com sucesso.'))
          .catch(err => console.log('Erro ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
